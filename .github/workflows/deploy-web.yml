name: Deploy website

# Builds the Astro site in web/ and publishes it to GitHub Pages as a Pages
# artifact. Manual only until the cutover from the legacy main:/docs source
# is approved; see README "Website cutover". After cutover, add:
#   push: { branches: [main], paths: ["web/**", "packages/core/**"] }

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (fails if any page breaks the website rules)
        run: pnpm --filter @udan/web build
        env:
          PUBLIC_APP_URL: https://app.udantravelsbdq.com
      - name: Every route is 200 HTML, readable without JavaScript
        run: pnpm --filter @udan/web verify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
